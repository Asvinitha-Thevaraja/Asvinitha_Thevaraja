  <g font-size="18">
    <rect x="320" y="745" width="290" height="215" rx="16" fill="#f6f7fb"/>
    <path d="M430 770 L400 783 L378 815 L402 833 L415 820 L415 900 L505 900 L505 820 L518 833 L542 815 L520 783 L490 770 Q480 787 460 787 Q440 787 430 770 Z" fill="#111827"/>
    <text x="340" y="935" fill="#111827" font-weight="600">Classic Black Tee</text><text x="545" y="935" fill="#3b6fe0" font-weight="700">$18</text>
    <rect x="630" y="745" width="290" height="215" rx="16" fill="#f6f7fb"/>
    <path d="M740 770 L710 783 L688 815 L712 833 L725 820 L725 900 L815 900 L815 820 L828 833 L852 815 L830 783 L800 770 Q790 787 770 787 Q750 787 740 770 Z" fill="#e2557a"/>
    <text x="650" y="935" fill="#111827" font-weight="600">Rose Graphic Tee</text><text x="855" y="935" fill="#3b6fe0" font-weight="700">$22</text>
    <rect x="940" y="745" width="290" height="215" rx="16" fill="#f6f7fb"/>
    <path d="M1050 770 L1020 783 L998 815 L1022 833 L1035 820 L1035 900 L1125 900 L1125 820 L1138 833 L1162 815 L1140 783 L1110 770 Q1100 787 1080 787 Q1060 787 1050 770 Z" fill="#22a06b"/>
    <text x="960" y="935" fill="#111827" font-weight="600">Forest Basic Tee</text><text x="1165" y="935" fill="#3b6fe0" font-weight="700">$16</text>
    <rect x="1250" y="745" width="310" height="215" rx="16" fill="#f6f7fb"/>
    <path d="M1370 770 L1340 783 L1318 815 L1342 833 L1355 820 L1355 900 L1445 900 L1445 820 L1458 833 L1482 815 L1460 783 L1430 770 Q1420 787 1400 787 Q1380 787 1370 770 Z" fill="#f5b83d"/>
    <text x="1270" y="935" fill="#111827" font-weight="600">Sunny Oversized Tee</text><text x="1500" y="935" fill="#3b6fe0" font-weight="700">$24</text>
  </g>
