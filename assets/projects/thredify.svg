  <text x="700" y="392" font-size="30" font-weight="800" fill="#3b6fe0" text-anchor="middle">THRED</text>
  <text x="700" y="428" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">IFY</text>
  <rect x="615" y="315" width="170" height="170" fill="none" stroke="#7aa2ff" stroke-width="3" stroke-dasharray="10 8"/>
