    <text x="66" y="210">Category</text>
    <rect x="66" y="226" width="20" height="20" rx="5" fill="#3b6fe0"/><text x="96" y="243">T-Shirts</text>
    <rect x="66" y="260" width="20" height="20" rx="5" fill="#d1d5db"/><text x="96" y="277">Hoodies</text>
    <rect x="66" y="294" width="20" height="20" rx="5" fill="#d1d5db"/><text x="96" y="311">Caps</text>
    <text x="66" y="370">Size</text>
    <rect x="66" y="386" width="44" height="38" rx="8" fill="#fff" stroke="#d1d5db"/><text x="80" y="411">S</text>
    <rect x="118" y="386" width="44" height="38" rx="8" fill="#111827"/><text x="130" y="411" fill="#fff">M</text>
    <rect x="170" y="386" width="44" height="38" rx="8" fill="#fff" stroke="#d1d5db"/><text x="184" y="411">L</text>
    <rect x="222" y="386" width="50" height="38" rx="8" fill="#fff" stroke="#d1d5db"/><text x="232" y="411">XL</text>
