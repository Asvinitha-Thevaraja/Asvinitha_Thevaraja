  <path d="M590 220 L520 250 L455 330 L520 380 L560 345 L560 610 L840 610 L840 345 L880 380 L945 330 L880 250 L810 220 Q780 262 700 262 Q620 262 590 220 Z" fill="url(#tee)"/>
  <path d="M590 220 Q620 262 700 262 Q780 262 810 220 Q780 245 700 245 Q620 245 590 220 Z" fill="#1d3f9a"/>
