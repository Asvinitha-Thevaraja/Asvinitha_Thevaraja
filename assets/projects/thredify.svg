  <rect x="890" y="134" width="70" height="36" rx="18" fill="#111827"/><text x="908" y="158" font-size="17" font-weight="700" fill="#fff">2D</text>
  <rect x="968" y="134" width="80" height="36" rx="18" fill="#3b6fe0"/><text x="988" y="158" font-size="17" font-weight="700" fill="#fff">3D</text>
