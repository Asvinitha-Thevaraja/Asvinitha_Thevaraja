  <text x="1140" y="210" font-size="19" fill="#374151">Colour</text>
  <circle cx="1160" cy="248" r="20" fill="#3b6fe0" stroke="#111827" stroke-width="4"/><circle cx="1212" cy="248" r="20" fill="#111827"/><circle cx="1264" cy="248" r="20" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/><circle cx="1316" cy="248" r="20" fill="#e2557a"/><circle cx="1368" cy="248" r="20" fill="#22a06b"/><circle cx="1420" cy="248" r="20" fill="#f5b83d"/>
  <text x="1140" y="315" font-size="19" fill="#374151">Add text</text>
  <rect x="1140" y="330" width="390" height="50" rx="12" fill="#ffffff" stroke="#d1d5db"/><text x="1160" y="362" font-size="19" fill="#111827">THREDIFY</text>
