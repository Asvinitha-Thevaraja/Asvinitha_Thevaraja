<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="Segoe UI, Arial, sans-serif">
  <!-- PLACEHOLDER IMAGE: replace with a real screenshot (save as thredify.png) -->
  <defs>
    <linearGradient id="stage" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1f3f9"/><stop offset="1" stop-color="#e3e8f4"/></linearGradient>
    <linearGradient id="tee" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b6fe0"/><stop offset="1" stop-color="#2a4fb0"/></linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="#ffffff"/>

  <!-- nav -->
  <rect width="1600" height="86" fill="#111827"/>
  <text x="56" y="56" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="1">THRED<tspan fill="#7aa2ff">IFY</tspan></text>
  <g font-size="21" fill="#cbd5e1"><text x="560" y="54">Shop</text><text x="650" y="54">Men</text><text x="735" y="54">Women</text><text x="850" y="54" fill="#ffffff" font-weight="700">Customize</text></g>
  <rect x="1240" y="24" width="210" height="40" rx="20" fill="#1f2937"/><text x="1262" y="51" font-size="18" fill="#94a3b8">Search…</text>
  <circle cx="1510" cy="44" r="22" fill="#3b6fe0"/><text x="1500" y="51" font-size="20" font-weight="700" fill="#fff">2</text>

