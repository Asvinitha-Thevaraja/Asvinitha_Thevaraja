  <rect x="1140" y="440" width="390" height="80" rx="12" fill="#ffffff" stroke="#9db8f5" stroke-dasharray="8 6"/><text x="1240" y="488" font-size="18" fill="#3b6fe0">⬆  Drop your image here</text>
